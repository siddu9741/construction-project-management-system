<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials | Construction PMS</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">

  <style>
    .materials-page {
      max-width: 1000px;
      margin: 40px auto;
      padding: 24px;
    }

    .material-card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      margin: 20px 0;
      box-shadow: 0 8px 24px rgba(25, 40, 55, 0.08);
    }

    .material-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .material-form label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .material-form input,
    .material-form textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid #d5dce3;
      border-radius: 8px;
    }

    .material-form textarea {
      min-height: 82px;
      resize: vertical;
    }

    .materials-page button {
      min-height: 40px;
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      background: #e99424;
      color: #17212b;
      font-weight: 700;
      cursor: pointer;
    }

    .materials-page button.secondary {
      background: #e9eef3;
    }

    .materials-page button.danger {
      background: #fce4e4;
      color: #9b2222;
    }

    .material-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .material-table th,
    .material-table td {
      padding: 12px;
      border-bottom: 1px solid #e6ebf0;
      text-align: left;
      vertical-align: top;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .material-message {
      min-height: 24px;
      font-weight: 600;
    }

    .material-message.error {
      color: #b42318;
    }

    .material-message.success {
      color: #18794e;
    }

    @media (max-width: 650px) {
      .materials-page {
        margin: 16px auto;
        padding: 14px;
      }

      .material-card {
        padding: 16px;
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>
  <main class="materials-page">
    <a id="dashboardLink" href="/projects.html" data-i18n="materialBack">
      ← Back to Projects
    </a>

    <header>
      <h1 data-i18n="materialTitle">Materials Catalog</h1>
      <p data-i18n="materialIntro">View and manage construction materials and their units.</p>
    </header>

    <p id="materialMessage" class="material-message" role="status"></p>

    <section id="materialFormCard" class="material-card" hidden>
      <h2 id="formHeading" data-i18n="materialAdd">Add a material</h2>

      <form id="materialForm" class="material-form">
        <div>
          <label for="materialName" data-i18n="materialNameLabel">Material name *</label>
          <input id="materialName" type="text" maxlength="150" required>
        </div>

        <div>
          <label for="materialUnit" data-i18n="materialUnitLabel">Unit *</label>
          <input
            id="materialUnit"
            type="text"
            maxlength="40"
            placeholder="Example: bag, kg, meter, piece"
            data-i18n-placeholder="materialUnitPlaceholder"
            required
          >
        </div>

        <div>
          <label for="materialDescription" data-i18n="materialDescriptionLabel">Description</label>
          <textarea id="materialDescription" maxlength="500"></textarea>
        </div>

        <div>
          <button id="saveMaterialButton" type="submit" data-i18n="materialSave">
            Save Material
          </button>
          <button id="cancelEditButton" class="secondary" type="button" hidden
                  data-i18n="materialCancelEdit">
            Cancel edit
          </button>
        </div>
      </form>
    </section>

    <section class="material-card">
      <h2 data-i18n="materialListTitle">Materials</h2>
      <div id="materialList" data-i18n="materialLoading">Loading materials...</div>
    </section>
  </main>

  <script src="/js/app-language.js" defer></script>
  <script src="/js/materials.js" defer></script>
</body>
</html>
